name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: ${{runner.os == 'Linux'}}

  query:
    name: Validate queries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Build parser
        run: tree-sitter build
      - name: Set up ts_query_ls
        run: curl -fL https://github.com/ribru17/ts_query_ls/releases/latest/download/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz | tar -xz
      - name: Check queries
        run: ./ts_query_ls check -f queries/
      # The Neovim queries are also checked against the captures, predicates
      # and directives that nvim-treesitter accepts.
      - name: Check Neovim queries against nvim-treesitter rules
        run: |-
          curl -fsSL https://raw.githubusercontent.com/nvim-treesitter/nvim-treesitter/main/.tsqueryrc.json |
            jq '.parser_install_directories = ["."] | .parser_aliases = {"neovim": "edl"}' > nvim-tsqueryrc.json
          ./ts_query_ls check --config "$(cat nvim-tsqueryrc.json)" queries/neovim/

  examples:
    name: Parse real-world EDL files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      # Only the .edl files are checked out. The commits are pinned so that
      # upstream changes can't break CI; bump them from time to time.
      - name: Fetch Intel SGX SDK
        uses: actions/checkout@v6
        with:
          repository: intel/confidential-computing.sgx.sdk
          ref: beb1157a204f006e1dc50fdce77a294fb42518de
          path: examples/intel-sgx-sdk
          filter: blob:none
          sparse-checkout: "*.edl"
          sparse-checkout-cone-mode: false
      - name: Fetch Open Enclave
        uses: actions/checkout@v6
        with:
          repository: openenclave/openenclave
          ref: ae8ea3c85823bd0af2915123d9f211edba20fbd6
          path: examples/openenclave
          filter: blob:none
          sparse-checkout: "*.edl"
          sparse-checkout-cone-mode: false
      - name: Fetch oeedger8r-cpp
        uses: actions/checkout@v6
        with:
          repository: openenclave/oeedger8r-cpp
          ref: 420c5d517d8e0a017e3a2ee63f588ef9db749e03
          path: examples/oeedger8r-cpp
          filter: blob:none
          sparse-checkout: "*.edl"
          sparse-checkout-cone-mode: false
      - name: Fetch Teaclave SGX SDK
        uses: actions/checkout@v6
        with:
          repository: apache/incubator-teaclave-sgx-sdk
          ref: f51f56da67fccd919b5dafee9c35d6881a8e15d8
          path: examples/teaclave-sgx-sdk
          filter: blob:none
          sparse-checkout: "*.edl"
          sparse-checkout-cone-mode: false
      - name: Parse examples
        uses: tree-sitter/parse-action@v5
        with:
          files: examples/**/*.edl
          # Deliberately invalid: oeedger8r's own negative test (attributes on an enumerator).
          invalid-files: |-
            examples/oeedger8r-cpp/test/attributes/attributes.edl
